name: Keepalive validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/keepalive.yml'
      - '.github/workflows/login.yml'
      - 'scripts/keepalive.sh'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check shell syntax and 50-day boundaries
        run: |
          bash -n scripts/keepalive.sh
          now=$(date +%s)
          test "$(KEEPALIVE_TEST_NOW=$now KEEPALIVE_TEST_LAST=$now bash scripts/keepalive.sh)" = 'skip'
          test "$(KEEPALIVE_TEST_NOW=$now KEEPALIVE_TEST_LAST=$((now - 49*86400)) bash scripts/keepalive.sh)" = 'skip'
          test "$(KEEPALIVE_TEST_NOW=$now KEEPALIVE_TEST_LAST=$((now - 50*86400)) bash scripts/keepalive.sh)" = 'commit'
